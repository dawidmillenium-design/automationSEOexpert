name: SEO baseline
on:
  push:
    branches: [seo-technical-baseline]
    paths: [".github/workflows/seo-baseline.yml", "scripts/seo_baseline.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run SEO baseline fixer (fails the job if checks fail)
        run: python scripts/seo_baseline.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Apply SEO technical baseline (canonicals, OG, JSON-LD, linking, sitemap)"
          git push
